<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>THUG SZN | Exclusive Drop</title>
  <style>
    :root {
      --bg-color: #0d0d0d;
      --card-bg: #161616;
      --accent: #00ff66;
      --text: #ffffff;
      --muted: #888888;
      --border: #262626;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Impact', 'Arial Black', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      padding: 2rem 1rem;
    }

    .header {
      text-align: center;
      margin-bottom: 3rem;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .header h1 {
      font-size: 3.5rem;
      background: linear-gradient(180deg, #fff 0%, #555 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header p {
      font-family: sans-serif;
      color: var(--accent);
      font-weight: 600;
      margin-top: 0.5rem;
      letter-spacing: 4px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .card:hover {
      transform: translateY(-8px);
      border-color: var(--accent);
    }

    .badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: var(--accent);
      color: #000;
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 4px;
      font-weight: bold;
      z-index: 2;
    }

    .img-container {
      width: 100%;
      height: 320px;
      background: #1f1f1f;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .card:hover .img-container img {
      transform: scale(1.08);
    }

    .details {
      padding: 1.5rem;
      font-family: sans-serif;
    }

    .details h3 {
      font-size: 1.25rem;
      letter-spacing: 1px;
      margin-bottom: 0.5rem;
      font-family: 'Impact', sans-serif;
      text-transform: uppercase;
    }

    .price-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1rem;
    }

    .price {
      font-size: 1.4rem;
      color: var(--text);
      font-weight: bold;
    }

    .btn-add {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 0.6rem 1.2rem;
      font-weight: bold;
      cursor: pointer;
      border-radius: 6px;
      transition: background 0.2s, color 0.2s;
    }

    .btn-add:hover {
      background: var(--accent);
      color: #000;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>THUG SZN</h1>
    <p>LIMITED DROP // SEASON 01</p>
  </div>

  <div class="grid">
    <div class="card">
      <span class="badge">NEW</span>
      <div class="img-container">
        <img src="https://images.unsplash.com/photo-1556905055-8f358a7a47b2?auto=format&fit=crop&w=600&q=80" alt="Hoodie" />
      </div>
      <div class="details">
        <h3>Cyber Oversized Hoodie</h3>
        <p style="color: var(--muted); font-size: 0.9rem;">Heavyweight Cotton | Black</p>
        <div class="price-row">
          <span class="price">$120</span>
          <button class="btn-add">ADD TO CART</button>
        </div>
      </div>
    </div>

    <div class="card">
      <span class="badge" style="background: #ff0055; color: #fff;">SOLD OUT</span>
      <div class="img-container">
        <img src="https://images.unsplash.com/photo-1521572267360-ee0c2909d518?auto=format&fit=crop&w=600&q=80" alt="Tee" />
      </div>
      <div class="details">
        <h3>Acid Wash Graphic Tee</h3>
        <p style="color: var(--muted); font-size: 0.9rem;">100% Vintage Vintage Cut</p>
        <div class="price-row">
          <span class="price">$65</span>
          <button class="btn-add" disabled style="opacity:0.5; cursor:not-allowed;">UNAVAILABLE</button>
        </div>
      </div>
    </div>

    <div class="card">
      <span class="badge">EXCLUSIVE</span>
      <div class="img-container">
        <img src="https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=600&q=80" alt="Cargo" />
      </div>
      <div class="details">
        <h3>Tactical Cargo Pants</h3>
        <p style="color: var(--muted); font-size: 0.9rem;">Multi-pocket | Strapped</p>
        <div class="price-row">
          <span class="price">$140</span>
          <button class="btn-add">ADD TO CART</button>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
