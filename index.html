  /* =========================================================

  ========================================================= */

  function createFeatured() {
    if (document.getElementById("v4-featured")) return;

    const sourceProducts = productData();

    const featured =
      sourceProducts.find(product => product.id === 2) ||
      sourceProducts.find(product => product.available) ||
      sourceProducts[0];

    if (!featured) return;

    const section = document.createElement("section");

    section.id = "v4-featured";
    section.className = "v4-enter";

    section.innerHTML = `
      <div class="v4-featured-shell">

        <div class="v4-featured-media">

          <img
            src="${featured.image}"
            alt="${featured.name}"
            loading="lazy"
            onerror="imageFallback(this)"
          >

          <div class="v4-featured-number">
            DROP <span>01</span> / 2026
          </div>

          <div class="v4-featured-tag">
            THUG SZN / BUILT DIFFERENT
          </div>

        </div>

        <div class="v4-featured-content">

          <div class="v4-kicker">
            FEATURED PIECE
          </div>

          <h2>
            BUILT
            <span>DIFFERENT.</span>
          </h2>

          <p class="v4-featured-copy">
            ${featured.description}
            Designed for the current THUG SZN drop and built around
            the same mindset that drives the brand.
          </p>

          <div class="v4-featured-meta">

            <div>
              <strong>WORLDWIDE</strong>
              <span>Shipping</span>
            </div>

            <div>
              <strong>SECURE</strong>
              <span>Paystack</span>
            </div>

            <div>
              <strong>THUG SZN</strong>
              <span>2026 Drop</span>
            </div>

          </div>

          <div class="v4-featured-price">
            $${Number(featured.price || 0).toFixed(2)}
          </div>

          <button
            class="btn"
            onclick="openProduct(${featured.id})"
          >
            View Featured Piece
          </button>

        </div>

      </div>
    `;

    const anchor =
      document.querySelector(".v2-marquee") ||
      document.querySelector(".trust-strip");

    if (anchor) {
      anchor.after(section);
    } else {
      document.querySelector("main")?.prepend(section);
    }

    requestAnimationFrame(() => {
      setTimeout(() => section.classList.add("visible"), 80);
    });
  }

  /* =========================================================
     EDITORIAL LOOKBOOK
  ========================================================= */

  function createLookbook() {
    if (document.getElementById("v4-lookbook")) return;

    const sourceProducts = productData();

    if (!sourceProducts.length) return;

    const selections = [
      sourceProducts[0],
      sourceProducts[2] || sourceProducts[1],
      sourceProducts[4] || sourceProducts[sourceProducts.length - 1]
    ].filter(Boolean);

    if (!selections.length) return;

    const section = document.createElement("section");

    section.id = "v4-lookbook";
    section.className = "v4-enter";

    const cards = selections.map((product, index) => `
      <article
        class="v4-lookbook-card"
        onclick="openProduct(${product.id})"
      >

        <img
          src="${product.image}"
          alt="${product.name}"
          loading="lazy"
          onerror="imageFallback(this)"
        >

        <div class="v4-lookbook-copy">
          <span>
            ${String(index + 1).padStart(2, "0")} / THUG SZN
          </span>

          <strong>
            ${product.name}
          </strong>
        </div>

      </article>
    `).join("");

    section.innerHTML = `
      <div class="v4-editorial-heading">

        <div>
          <div class="small">
            THE VISUAL LANGUAGE
          </div>

          <h2>
            THE<br>
            LOOKBOOK.
          </h2>
        </div>

        <p>
          Pieces made to live outside the ordinary.
          Explore the current THUG SZN visual direction.
        </p>

      </div>

      <div class="v4-lookbook-grid">
        ${cards}
      </div>
    `;

    const collection =
      document.querySelector("#collection");

    if (collection) {
      collection.after(section);
    }

    requestAnimationFrame(() => {
      setTimeout(() => section.classList.add("visible"), 150);
    });
  }

  /* =========================================================
     MANIFESTO
  ========================================================= */

  function createManifesto() {
    if (document.getElementById("v4-manifesto")) return;

    const section = document.createElement("section");

    section.id = "v4-manifesto";
    section.className = "v4-enter";

    section.innerHTML = `
      <div class="v4-manifesto-inner">

        <span>
          THE THUG SZN CODE
        </span>

        <h2>
          MOVE.
          <em>THINK.</em>
          CREATE.
          <em>DIFFERENT.</em>
        </h2>

        <div class="v4-manifesto-bottom">

          <p>
            Pressure changes people.
            We choose to let it build us.
            THUG SZN represents the mindset of staying focused,
            creating your own path and refusing to move with the crowd.
          </p>

          <div class="v4-manifesto-sign">
            BUILT FROM PRESSURE
          </div>

        </div>

      </div>
    `;

    const story =
      document.querySelector("#story");

    if (story) {
      story.after(section);
    }
  }

  /* =========================================================
     RECENTLY VIEWED
  ========================================================= */

  function createRecentlyViewed() {
    if (document.getElementById("v4-recently-viewed")) return;

    const section = document.createElement("section");

    section.id = "v4-recently-viewed";

    section.innerHTML = `
      <div class="v4-recent-head">

        <div>
          <span>CONTINUE EXPLORING</span>
          <h2>RECENTLY VIEWED.</h2>
        </div>

      </div>

      <div
        class="v4-recent-grid"
        id="v4-recent-grid"
      ></div>
    `;

    const footer =
      document.querySelector("footer");

    if (footer) {
      footer.before(section);
    } else {
      document.querySelector("main")?.appendChild(section);
    }

    renderRecentlyViewed();
  }

  function renderRecentlyViewed() {
    const section =
      document.getElementById("v4-recently-viewed");

    const grid =
      document.getElementById("v4-recent-grid");

    if (!section || !grid) return;

    const sourceProducts = productData();

    const recent =
      viewedProducts
        .map(id =>
          sourceProducts.find(product => product.id === id)
        )
        .filter(Boolean)
        .slice(0, 4);

    if (!recent.length) {
      section.classList.remove("visible");
      return;
    }

    section.classList.add("visible");

    grid.innerHTML = recent.map(product => `
      <article
        class="v4-recent-card"
        onclick="openProduct(${product.id})"
      >

        <img
          src="${product.image}"
          alt="${product.name}"
          loading="lazy"
          onerror="imageFallback(this)"
        >

        <div class="v4-recent-info">

          <strong>
            ${product.name}
          </strong>

          <span>
            ${
              product.available
                ? `$${Number(product.price).toFixed(2)}`
                : "COMING SOON"
            }
          </span>

        </div>

      </article>
    `).join("");
  }

  /* =========================================================
     VIEW TRACKING
  ========================================================= */

  function trackViewedProduct(id) {

    viewedProducts =
      viewedProducts.filter(productId => productId !== id);

    viewedProducts.unshift(id);

    viewedProducts =
      viewedProducts.slice(0, 8);

    localStorage.setItem(
      VIEWED_KEY,
      JSON.stringify(viewedProducts)
    );

    renderRecentlyViewed();
  }

  /* =========================================================
     WISHLIST DRAWER
  ========================================================= */

  function createWishlistDrawer() {

    if (document.getElementById("v4-wishlist-drawer")) {
      return;
    }

    const overlay =
      document.createElement("div");

    overlay.id = "v4-wishlist-overlay";

    overlay.onclick = closeWishlist;

    const drawer =
      document.createElement("aside");

    drawer.id = "v4-wishlist-drawer";

    drawer.innerHTML = `
      <div class="v4-wishlist-head">

        <h2>
          SAVED
          <span>PIECES</span>
        </h2>

        <button
          class="v4-wishlist-close"
          onclick="closeWishlist()"
          aria-label="Close wishlist"
        >
          ×
        </button>

      </div>

      <div
        class="v4-wishlist-items"
        id="v4-wishlist-items"
      ></div>

    `;

    document.body.appendChild(overlay);
    document.body.appendChild(drawer);

    renderWishlist();
  }

  function renderWishlist() {

    const container =
      document.getElementById("v4-wishlist-items");

    if (!container) return;

    const sourceProducts = productData();

    const items =
      wishlist
        .map(id =>
          sourceProducts.find(product => product.id === id)
        )
        .filter(Boolean);

    if (!items.length) {

      container.innerHTML = `
        <div class="v4-wishlist-empty">

          <strong>
            No saved pieces yet.
          </strong>

          Tap the heart on any product
          you want to keep close.

        </div>
      `;

      updateWishlistCounters();

      return;
    }

    container.innerHTML = items.map(product => `
      <div class="v4-wishlist-item">

        <img
          src="${product.image}"
          alt="${product.name}"
          onerror="imageFallback(this)"
        >

        <div>

          <h4>
            ${product.name}
          </h4>

          <p>
            ${
              product.available
                ? `$${Number(product.price).toFixed(2)}`
                : "COMING SOON"
            }
          </p>

        </div>

        <button
          onclick="v4RemoveWishlist(${product.id})"
          aria-label="Remove from wishlist"
        >
          ×
        </button>

      </div>
    `).join("");

    updateWishlistCounters();
  }

  function updateWishlistCounters() {

    const count =
      wishlist.length;

    const desktop =
      document.getElementById("v4-header-wishlist-count");

    const mobile =
      document.querySelector(
        ".v4-mobile-wish-count"
      );

    if (desktop) {
      desktop.textContent = count;
    }

    if (mobile) {
      mobile.textContent = count;
    }

    document
      .querySelectorAll(".v4-wishlist")
      .forEach(button => {

        const id =
          Number(button.dataset.productId);

        button.classList.toggle(
          "active",
          wishlist.includes(id)
        );

        button.innerHTML =
          wishlist.includes(id)
            ? "♥"
            : "♡";
      });
  }

  window.v4ToggleWishlist =
    function(id, button) {

      const index =
        wishlist.indexOf(id);

      if (index === -1) {

        wishlist.push(id);

        showToast?.(
          "Piece saved to your wishlist."
        );

      } else {

        wishlist.splice(index, 1);

        showToast?.(
          "Piece removed from your wishlist."
        );
      }

      localStorage.setItem(
        WISHLIST_KEY,
        JSON.stringify(wishlist)
      );

      updateWishlistCounters();
      renderWishlist();
    };

  window.v4RemoveWishlist =
    function(id) {

      wishlist =
        wishlist.filter(
          productId => productId !== id
        );

      localStorage.setItem(
        WISHLIST_KEY,
        JSON.stringify(wishlist)
      );

      renderWishlist();
      updateWishlistCounters();
    };

  window.openWishlist =
    function() {

      createWishlistDrawer();

      document
        .getElementById("v4-wishlist-overlay")
        ?.classList.add("open");

      document
        .getElementById("v4-wishlist-drawer")
        ?.classList.add("open");

      document.body.classList.add("modal-open");

    };

  window.closeWishlist =
    function() {

      document
        .getElementById("v4-wishlist-overlay")
        ?.classList.remove("open");

      document
        .getElementById("v4-wishlist-drawer")
        ?.classList.remove("open");

      if (
        !document.querySelector(".modal-overlay.open") &&
        !document.querySelector(".cart-drawer.open")
      ) {
        document.body.classList.remove("modal-open");
      }

    };

  /* =========================================================
     HEADER WISHLIST BUTTON
  ========================================================= */

  function createHeaderWishlist() {

    const cartButton =
      document.querySelector(".cart-button");

    if (
      !cartButton ||
      document.querySelector(".v4-header-wishlist")
    ) {
      return;
    }

    const button =
      document.createElement("button");

    button.className =
      "v4-header-wishlist";

    button.onclick =
      () => openWishlist();

    button.innerHTML = `
      SAVED (
      <span id="v4-header-wishlist-count">
        ${wishlist.length}
      </span>
      )
    `;

    cartButton.before(button);
  }

  /* =========================================================
     MOBILE BOTTOM BAR
  ========================================================= */

  function createMobileBar() {

    if (document.getElementById("v4-mobile-bar")) {
      return;
    }

    const bar =
      document.createElement("nav");

    bar.id = "v4-mobile-bar";

    bar.innerHTML = `

      <a href="#home">
        <strong>⌂</strong>
        Home
      </a>

      <a href="#collection">
        <strong>◫</strong>
        Shop
      </a>

      <button onclick="openWishlist()">
        <strong>♡</strong>
        Saved
        <span class="v4-mobile-wish-count">
          ${wishlist.length}
        </span>
      </button>

      <button onclick="openCart()">
        <strong>□</strong>
        Cart
        <span class="v4-mobile-cart-count">
          0
        </span>
      </button>

    `;

    document.body.appendChild(bar);

    updateMobileCartCount();
  }

  function updateMobileCartCount() {

    const count =
      Array.isArray(window.cart)
        ? window.cart.reduce(
            (sum, item) =>
              sum + Number(item.quantity || 0),
            0
          )
        : 0;

    document
      .querySelectorAll(".v4-mobile-cart-count")
      .forEach(el => {
        el.textContent = count;
      });
  }

  /* =========================================================
     ENHANCE PRODUCT CARDS
  ========================================================= */

  function enhanceProductCards() {

    const cards =
      document.querySelectorAll(
        "#products-grid .product-card"
      );

    cards.forEach((card, index) => {

      if (card.dataset.v4Ready === "true") {
        return;
      }

      const viewButton =
        card.querySelector(".view-product");

      const onclick =
        viewButton?.getAttribute("onclick") || "";

      const match =
        onclick.match(/openProduct\\((\\d+)\\)/);

      const productId =
        match ? Number(match[1]) : null;

      if (!productId) return;

      card.dataset.v4Ready = "true";

      const imageWrap =
        card.querySelector(".product-image");

      if (!imageWrap) return;

      const heart =
        document.createElement("button");

      heart.type = "button";
      heart.className = "v4-wishlist";
      heart.dataset.productId = productId;
      heart.setAttribute(
        "aria-label",
        "Save product"
      );

      heart.innerHTML =
        wishlist.includes(productId)
          ? "♥"
          : "♡";

      heart.classList.toggle(
        "active",
        wishlist.includes(productId)
      );

      heart.onclick =
        event => {

          event.stopPropagation();

          window.v4ToggleWishlist(
            productId,
            heart
          );
        };

      imageWrap.appendChild(heart);

      const indexBadge =
        document.createElement("div");

      indexBadge.className =
        "v4-card-index";

      indexBadge.textContent =
        `${String(index + 1).padStart(2, "0")} / ${String(cards.length).padStart(2, "0")}`;

      imageWrap.appendChild(indexBadge);
    });

    updateWishlistCounters();
  }

  /* =========================================================
     PATCH PRODUCT RENDERING
  ========================================================= */

  function patchRenderProducts() {

    if (
      typeof window.renderProducts !== "function" ||
      window.__v4RenderPatched
    ) {
      return;
    }

    const originalRenderProducts =
      window.renderProducts;

    window.renderProducts =
      function() {

        originalRenderProducts();

        requestAnimationFrame(() => {
          enhanceProductCards();
        });

      };

    window.__v4RenderPatched = true;

    originalRenderProducts();

    setTimeout(
      enhanceProductCards,
      100
    );
  }

  /* =========================================================
     PATCH OPEN PRODUCT
  ========================================================= */

  function patchOpenProduct() {

    if (
      typeof window.openProduct !== "function" ||
      window.__v4OpenPatched
    ) {
      return;
    }

    const originalOpenProduct =
      window.openProduct;

    window.openProduct =
      function(id) {

        trackViewedProduct(id);

        originalOpenProduct(id);

        setTimeout(
          updateWishlistCounters,
          30
        );

      };

    window.__v4OpenPatched = true;
  }

  /* =========================================================
     KEEP MOBILE COUNTS IN SYNC
  ========================================================= */

  function patchCartRendering() {

    if (
      typeof window.renderCart !== "function" ||
      window.__v4CartPatched
    ) {
      return;
    }

    const originalRenderCart =
      window.renderCart;

    window.renderCart =
      function() {

        originalRenderCart();

        updateMobileCartCount();

      };

    window.__v4CartPatched = true;

    originalRenderCart();
  }

  /* =========================================================
     INTERSECTION REVEAL
  ========================================================= */

  function setupReveals() {

    const targets =
      document.querySelectorAll(
        ".v4-enter"
      );

    if (
      !("IntersectionObserver" in window)
    ) {

      targets.forEach(el =>
        el.classList.add("visible")
      );

      return;
    }

    const observer =
      new IntersectionObserver(
        entries => {

          entries.forEach(entry => {

            if (
              entry.isIntersecting
            ) {

              entry.target.classList.add(
                "visible"
              );

              observer.unobserve(
                entry.target
              );

            }

          });

        },
        {
          threshold:.12,
          rootMargin:"0px 0px -8% 0px"
        }
      );

    targets.forEach(
      el => observer.observe(el)
    );
  }

  /* =========================================================
     ESCAPE SUPPORT
  ========================================================= */

  document.addEventListener(
    "keydown",
    event => {

      if (event.key !== "Escape") {
        return;
      }

      window.closeWishlist?.();

    }
  );

  /* =========================================================
     INIT
  ========================================================= */

  function initV4() {

    createFeatured();
    createLookbook();
    createManifesto();
    createRecentlyViewed();
    createWishlistDrawer();
    createHeaderWishlist();
    createMobileBar();

    patchRenderProducts();
    patchOpenProduct();
    patchCartRendering();

    setTimeout(() => {

      enhanceProductCards();
      updateWishlistCounters();
      updateMobileCartCount();
      setupReveals();

    }, 250);

  }

  if (document.readyState === "loading") {

    document.addEventListener(
      "DOMContentLoaded",
      initV4,
      { once:true }
    );

  } else {

    initV4();

  }

})();
</script>
