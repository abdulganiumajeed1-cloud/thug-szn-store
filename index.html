<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>THUG SZN | Exclusive Drop</title>
  <style>
    :root {
      --bg-color: #0d0d0d;
      --card-bg: #161616;
      --accent: #00ff66;
      --text: #ffffff;
      --muted: #888888;
      --border: #262626;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Impact', 'Arial Black', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      padding-top: 80px;
      padding-bottom: 3rem;
    }

    /* Sticky Navbar */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 70px;
      background: rgba(13, 13, 13, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 2rem;
      z-index: 100;
    }

    .nav-logo {
      font-size: 1.8rem;
      color: var(--text);
      text-decoration: none;
      letter-spacing: 2px;
    }

    .cart-btn {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 0.5rem 1rem;
      font-size: 0.9rem;
      cursor: pointer;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .cart-btn:hover {
      background: var(--accent);
      color: #000;
    }

    /* Page Header */
    .header {
      text-align: center;
      margin: 2rem 0 3rem;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .header h1 {
      font-size: 3.5rem;
      background: linear-gradient(180deg, #fff 0%, #555 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header p {
      font-family: sans-serif;
      color: var(--accent);
      font-weight: 600;
      margin-top: 0.5rem;
      letter-spacing: 4px;
    }

    /* Grid Layout */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 2rem;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1rem;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .card:hover {
      transform: translateY(-8px);
      border-color: var(--accent);
    }

    .badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: var(--accent);
      color: #000;
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 4px;
      font-weight: bold;
      z-index: 2;
    }

    .img-container {
      width: 100%;
      height: 320px;
      background: #1f1f1f;
      overflow: hidden;
    }

    .img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .card:hover .img-container img {
      transform: scale(1.08);
    }

    .details {
      padding: 1.5rem;
      font-family: sans-serif;
    }

    .details h3 {
      font-size: 1.25rem;
      margin-bottom: 0.5rem;
      font-family: 'Impact', sans-serif;
      text-transform: uppercase;
    }

    .price-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1rem;
    }

    .price {
      font-size: 1.4rem;
      font-weight: bold;
    }

    .btn-add {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 0.6rem 1.2rem;
      font-weight: bold;
      cursor: pointer;
      border-radius: 6px;
      transition: 0.2s;
    }

    .btn-add:hover {
      background: var(--accent);
      color: #000;
    }

    /* Cart Drawer */
    .cart-drawer {
      position: fixed;
      top: 0;
      right: -400px;
      width: 350px;
      height: 100%;
      background: #111;
      border-left: 1px solid var(--border);
      z-index: 200;
      transition: right 0.3s ease;
      display: flex;
      flex-direction: column;
      padding: 1.5rem;
      font-family: sans-serif;
    }

    .cart-drawer.open {
      right: 0;
    }

    .cart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text);
      font-size: 1.5rem;
      cursor: pointer;
    }

    .cart-items {
      flex: 1;
      overflow-y: auto;
      margin: 1rem 0;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      padding: 0.8rem 0;
      border-bottom: 1px solid #222;
      font-size: 0.9rem;
    }

    .cart-footer {
      border-top: 1px solid var(--border);
      padding-top: 1rem;
    }

    .checkout-btn {
      width: 100%;
      background: var(--accent);
      color: #000;
      border: none;
      padding: 0.8rem;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      border-radius: 6px;
      margin-top: 1rem;
    }
  </style>
</head>
<body>

  <!-- Top Navbar -->
  <nav class="navbar">
    <a href="#" class="nav-logo">THUG SZN</a>
    <button class="cart-btn" onclick="toggleCart()">
      CART (<span id="cart-count">0</span>)
    </button>
  </nav>

  <div class="header">
    <h1>THUG SZN</h1>
    <p>LIMITED DROP // SEASON 01</p>
  </div>

  <!-- Product Grid -->
  <div class="grid">
    <div class="card">
      <span class="badge">NEW</span>
      <div class="img-container">
        <img src="https://images.unsplash.com/photo-1556905055-8f358a7a47b2?auto=format&fit=crop&w=600&q=80" alt="Hoodie" />
      </div>
      <div class="details">
        <h3>Cyber Oversized Hoodie</h3>
        <p style="color: var(--muted); font-size: 0.9rem;">Heavyweight Cotton | Black</p>
        <div class="price-row">
          <span class="price">$120</span>
          <button class="btn-add" onclick="addToCart('Cyber Oversized Hoodie', 120)">ADD TO CART</button>
        </div>
      </div>
    </div>

    <div class="card">
      <span class="badge" style="background: #ff0055; color: #fff;">SOLD OUT</span>
      <div class="img-container">
        <img src="https://images.unsplash.com/photo-1521572267360-ee0c2909d518?auto=format&fit=crop&w=600&q=80" alt="Tee" />
      </div>
      <div class="details">
        <h3>Acid Wash Graphic Tee</h3>
        <p style="color: var(--muted); font-size: 0.9rem;">100% Vintage Cut</p>
        <div class="price-row">
          <span class="price">$65</span>
          <button class="btn-add" disabled style="opacity:0.5; cursor:not-allowed;">UNAVAILABLE</button>
        </div>
      </div>
    </div>

    <div class="card">
      <span class="badge">EXCLUSIVE</span>
      <div class="img-container">
        <img src="https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=600&q=80" alt="Cargo" />
      </div>
      <div class="details">
        <h3>Tactical Cargo Pants</h3>
        <p style="color: var(--muted); font-size: 0.9rem;">Multi-pocket | Strapped</p>
        <div class="price-row">
          <span class="price">$140</span>
          <button class="btn-add" onclick="addToCart('Tactical Cargo Pants', 140)">ADD TO CART</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Shopping Cart Drawer -->
  <div class="cart-drawer" id="cart-drawer">
    <div class="cart-header">
      <h2>YOUR CART</h2>
      <button class="close-btn" onclick="toggleCart()">&times;</button>
    </div>
    <div class="cart-items" id="cart-items">
      <p style="color: var(--muted); font-size: 0.9rem;">Your cart is empty.</p>
    </div>
    <div class="cart-footer">
      <div style="display: flex; justify-content: space-between; font-weight: bold;">
        <span>TOTAL:</span>
        <span id="cart-total">$0</span>
      </div>
      <button class="checkout-btn" onclick="alert('Checkout coming soon!')">CHECKOUT</button>
    </div>
  </div>

  <!-- Cart Logic -->
  <script>
    let cart = [];

    function toggleCart() {
      document.getElementById('cart-drawer').classList.toggle('open');
    }

    function addToCart(name, price) {
      cart.push({ name, price });
      updateCartUI();
      document.getElementById('cart-drawer').classList.add('open');
    }

    function updateCartUI() {
      const cartCount = document.getElementById('cart-count');
      const cartItems = document.getElementById('cart-items');
      const cartTotal = document.getElementById('cart-total');

      cartCount.innerText = cart.length;

      if (cart.length === 0) {
        cartItems.innerHTML = '<p style="color: var(--muted); font-size: 0.9rem;">Your cart is empty.</p>';
        cartTotal.innerText = '$0';
        return;
      }

      let itemsHTML = '';
      let total = 0;

      cart.forEach(item => {
        total += item.price;
        itemsHTML += `
          <div class="cart-item">
            <span>${item.name}</span>
            <span>$${item.price}</span>
          </div>
        `;
      });

      cartItems.innerHTML = itemsHTML;
      cartTotal.innerText = `$${total}`;
    }
  </script>
</body>
</html>
